<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Smythe&display=swap" 
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" 
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" 
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div id="container">
        <div id = 'part-1'>
            <section id='header'>
                <div id="titles">
                    <h2 id='header-title'>Jimmy's Diner</h2>
                    <p id='header-title2'>The best burgers and pizzas in town</p>
                </div>  
            </section>
        </div>

        <div class = 'pre-checkout' id = 'pre-checkout'>
            <h4 class = "checkout-title">Your order</h4>
            <div id="orders">

            </div>

            <div class='separator sep2'></div>
            <div class = "total" id="total">
                <h4>Total price:</h4>
                <p id = 'order-total'></p>
            </div>
            <button id="complete">Complete order</button>
        </div>
        <div id = 'empty-cart'></div>
        <div id = 'thanks-msg'></div>
 
    </div>

    <form for = 'submit'>
        <h4 class="pay-tittle">Enter card details</h4>
        <input type = 'text' 
                id = 'name' 
                name = 'name' 
                placeholder = 'Enter your name'
                minlength="2"
                maxlength="50"
                pattern="[a-zA-Z0-9\s]+"/>
                
        <input type = 'text' 
                id = 'card-num' 
                name = 'card-num' 
                placeholder = 'Enter card number'
                minlength="16"
                maxlength="19"
                pattern="[0-9\s]+"/>

        <input type = 'text' 
                id = 'cvv' 
                name = 'cvv' 
                placeholder = 'Enter CVV'
                pattern="\d{3}"
                maxlength="3"
                maxlength="3"
                inputmode="numeric"
                required/>

        <button type = 'button' id = 'submit'>Pay</button>
    </form>


    
    <script src="index.js" type="module" defer></script>
</body>
</html>
